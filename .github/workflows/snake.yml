name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shahzaib-code12
          outputs: |
            dist/github-snake.svg?color_snake=6366F1&color_dots=161B22,2F2459,4C3A8C,6366F1,8B5CF6
            dist/github-snake-dark.svg?color_snake=6366F1&color_dots=161B22,2F2459,4C3A8C,6366F1,8B5CF6

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
